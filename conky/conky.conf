conky.config = {
    background = true,
    update_interval = 0.1,
    
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    
    override_utf8_locale = true,
    
    double_buffer = true,
    no_buffers = true,
    
    text_buffer_size = 2048,
    
    own_window = true,
    own_window_type = 'override',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    border_inner_margin = 0,
    border_outer_margin = 0,
    
    minimum_width = 300,
    minimum_height = 150,
    
    -- --- POSISI STABIL DI TENGAH ATAS ---
    alignment = 'top_middle',
    gap_x = -750,
    gap_y = 50,   -- Jarak aman di bawah Polybar
    
    draw_shades = true,
    default_shade_color = '#000000',
    draw_outline = true,
    default_outline_color = '#000000',
    draw_borders = false,
    draw_graph_borders = false,
    
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=12',
    xftalpha = 1.0,
    
    uppercase = false,
    
    default_color = '#FFFFFF', 
    color1 = '#00FFFF',        -- Cyan Neon
    color2 = '#FFFFFF',        -- Ungu Neon
    color3 = '#FFFFFF',        -- Putih (Jam)
}

conky.text = [[
${color1}${font JetBrainsMono Nerd Font:size=60}${alignc}󰣇${font}
${voffset -5}
${color3}${font JetBrainsMono Nerd Font:bold:size=20}${alignc}${execi 0.1 ~/.config/conky/typing.sh}${font} 
${voffset 2}
${color2}${font JetBrainsMono Nerd Font:size=13}${alignc}${time %A, %d %B %Y}${font}
]]
